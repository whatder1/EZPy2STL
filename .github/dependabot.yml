version: 2
updates:
  # Python dependencies (build123d, fastapi, pywebview, pyinstaller, ...)
  # managed via pyproject.toml / uv.lock. Routine minor/patch bumps are
  # grouped into ONE weekly PR (fewer builds to babysit); a major bump or a
  # security update still arrives on its own so it can be judged separately.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Keeps the versions pinned in .github/workflows/*.yml (setup-uv,
  # actions/checkout, the release action) current too.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
