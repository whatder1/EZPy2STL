# Builds EZPy2STL.app + a .dmg on GitHub's macOS runners.
#
# Two triggers, two purposes:
#   - Pull requests that touch dependency/build files: build-only check,
#     no release published. This is what verifies a Dependabot PR
#     actually still builds before you merge it -- confirmed working
#     as of the v0.2.0 build (which caught a real lib3mf packaging
#     break before it reached main).
#   - A pushed version tag: same build, plus publishes the .dmg to a
#     GitHub Release.
#
# Usage for a release:
#   git tag v0.2.0
#   git push --tags

name: Build macOS App

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "ezpy2stl.spec"
      - "app/**"
      - "frontend/**"
      - "desktop.py"
      - "build_app.sh"
      - "make_dmg.sh"
      - ".github/workflows/build-macos-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Build app
        run: ./build_app.sh

      - name: Build dmg
        run: ./make_dmg.sh

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/EZPy2STL.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
