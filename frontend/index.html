<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>EZPy2STL</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --bg-0: #131318;
            --bg-1: #191b21;
            --bg-2: #0e0f13;
            --border: #2a2d36;
            --text: #e9e7e2;
            --text-muted: #8b8e99;
            --accent: #fe6e31;
            --accent-dim: #7a3a1e;
            --success: #6fcf97;
            --error: #ef6f6f;
            --font-ui: "IBM Plex Sans", sans-serif;
            --font-code: "IBM Plex Mono", monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--font-ui);
            background: var(--bg-0);
            color: var(--text);
        }

        button {
            font-family: var(--font-ui);
            cursor: pointer;
        }

        /* ---------------------------------------------------- */
        /* TOOLBAR                                               */
        /* ---------------------------------------------------- */

        #toolbar {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 14px 20px;
            background: var(--bg-1);
            border-bottom: 1px solid var(--border);
        }

        #toolbar h1 {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            margin-right: 4px;
            letter-spacing: 0.01em;
        }

        #toolbar h1 span {
            color: var(--accent);
        }

        .toolbar-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg-0);
            color: var(--text);
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .btn:hover {
            border-color: #454854;
            background: #1c1e26;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: default;
            pointer-events: none;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #1a0e07;
            font-weight: 600;
        }

        .btn-primary:hover {
            background: #ff7d47;
            border-color: #ff7d47;
        }

        .btn svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        #current-file {
            font-size: 12px;
            color: var(--text-muted);
            font-family: var(--font-code);
            margin-left: auto;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ---------------------------------------------------- */
        /* LAYOUT                                                */
        /* ---------------------------------------------------- */

        #layout {
            display: flex;
            height: calc(100vh - 57px);
        }

        #left {
            width: 46%;
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex-shrink: 0;
        }

        #divider {
            width: 6px;
            flex-shrink: 0;
            cursor: col-resize;
            background: var(--bg-1);
            position: relative;
        }

        #divider::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 2px;
            width: 2px;
            border-radius: 2px;
            background: var(--border);
        }

        #divider:hover::after,
        #divider.dragging::after {
            background: var(--accent);
        }

        #right {
            flex: 1;
            min-width: 240px;
            position: relative;
            background: var(--bg-2);
        }

        .panel-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            padding: 8px 16px 6px;
            background: var(--bg-1);
            border-bottom: 1px solid var(--border);
        }

        /* ---------------------------------------------------- */
        /* PARAMETERS PANEL                                      */
        /* ---------------------------------------------------- */

        #params-section:empty,
        #params-section:has(#params:empty) {
            display: none;
        }

        #params {
            max-height: 220px;
            overflow-y: auto;
            padding: 4px 16px;
            background: var(--bg-1);
            border-bottom: 1px solid var(--border);
        }

        .param-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 0;
            border-bottom: 1px solid #24262f;
        }

        .param-row:last-child {
            border-bottom: none;
        }

        .param-info {
            min-width: 0;
        }

        .param-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
        }

        .param-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 260px;
        }

        .param-control {
            flex-shrink: 0;
        }

        .param-control input[type="number"],
        .param-control input[type="text"] {
            width: 110px;
            padding: 5px 8px;
            font-family: var(--font-code);
            font-size: 13px;
            background: var(--bg-0);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
        }

        .param-control input[type="number"]:focus,
        .param-control input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .param-control input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }

        /* ---------------------------------------------------- */
        /* SCRIPT EDITOR                                         */
        /* ---------------------------------------------------- */

        #script {
            flex: 1;
            width: 100%;
            resize: none;
            border: none;
            outline: none;
            padding: 18px 20px;
            background: var(--bg-0);
            color: var(--text);
            font-family: var(--font-code);
            font-size: 13.5px;
            line-height: 1.6;
            min-height: 100px;
        }

        #params-divider,
        #console-divider {
            height: 6px;
            flex-shrink: 0;
            cursor: row-resize;
            background: var(--bg-1);
            position: relative;
        }

        #params-divider::after,
        #console-divider::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 2px;
            height: 2px;
            border-radius: 2px;
            background: var(--border);
        }

        #params-divider:hover::after,
        #params-divider.dragging::after,
        #console-divider:hover::after,
        #console-divider.dragging::after {
            background: var(--accent);
        }

        /* ---------------------------------------------------- */
        /* CONSOLE / OUTPUT                                      */
        /* ---------------------------------------------------- */

        #status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-1);
            border-top: 1px solid var(--border);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            flex-shrink: 0;
        }

        .status-dot.building {
            background: var(--accent);
            animation: pulse 1s ease-in-out infinite;
        }

        .status-dot.success {
            background: var(--success);
        }

        .status-dot.error {
            background: var(--error);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        #status-text {
            font-size: 12px;
            color: var(--text-muted);
        }

        #output {
            height: 130px;
            overflow: auto;
            white-space: pre-wrap;
            background: var(--bg-2);
            padding: 12px 16px;
            font-family: var(--font-code);
            font-size: 12.5px;
            line-height: 1.5;
            color: #c9c7c2;
        }

        /* ---------------------------------------------------- */
        /* FILE LIST                                             */
        /* ---------------------------------------------------- */

        #files-section:has(#files:empty) {
            display: none;
        }

        #files {
            padding: 4px 16px;
            background: var(--bg-1);
        }

        .file-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 9px 0;
            border-bottom: 1px solid #24262f;
        }

        .file-row:last-child {
            border-bottom: none;
        }

        .file-row.active .file-name {
            color: var(--accent);
        }

        .file-name {
            background: none;
            border: none;
            color: var(--text);
            font-family: var(--font-code);
            font-size: 12.5px;
            cursor: pointer;
            padding: 0;
            text-align: left;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .file-download {
            color: var(--text-muted);
            font-size: 12px;
            text-decoration: none;
        }

        .file-download:hover {
            color: var(--text);
        }

        .file-slicer {
            background: none;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            font-size: 12px;
            padding: 4px 9px;
        }

        .file-slicer:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .file-slicer:disabled {
            opacity: 0.5;
            cursor: default;
            border-color: var(--border);
            color: var(--text-muted);
        }

        /* ---------------------------------------------------- */
        /* VIEWER                                                */
        /* ---------------------------------------------------- */

        #viewer {
            width: 100%;
            height: 100%;
        }

        #hint {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(14, 15, 19, 0.85);
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 4px;
            color: var(--text-muted);
            font-size: 11.5px;
            pointer-events: none;
        }

    </style>
</head>

<body>

    <div id="toolbar">

        <h1>EZPy<span>2</span>STL</h1>

        <input
            type="file"
            id="file-input"
            accept=".py"
            style="display: none;"
        >

        <div class="toolbar-actions">
            <button id="open-button" class="btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/>
                </svg>
                Open
            </button>

            <button id="save-button" class="btn" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 5h11l3 3v11H5V5Z"/>
                    <path d="M8 5v5h8V5M8 19v-6h8v6"/>
                </svg>
                Save
            </button>

            <button id="save-as-button" class="btn">
                Save As…
            </button>

            <button id="build-button" class="btn btn-primary">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 3v18l7-5 7 5V3H5Z"/>
                </svg>
                Build
            </button>
        </div>

        <span id="current-file"></span>

    </div>


    <div id="layout">

        <div id="left">

            <div id="params-section">
                <div class="panel-label">Parameters</div>
                <div id="params"></div>
            </div>

            <div id="params-divider"></div>

            <textarea id="script" spellcheck="false"></textarea>

            <div id="console-divider"></div>

            <div id="status-bar">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Ready</span>
            </div>

            <div id="output">Ready.</div>

            <div id="files-section">
                <div class="panel-label">Generated files</div>
                <div id="files"></div>
            </div>

        </div>


        <div id="divider"></div>


        <div id="right">

            <div id="viewer"></div>

            <div id="hint">
                Drag to rotate • Scroll to zoom • Right-drag to pan
            </div>

        </div>

    </div>


    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>

    <script type="module" src="/static/app.js"></script>

</body>

</html>
